[project]
name = "hs-pinn"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "kloppy>=3.19.0",
    "matplotlib>=3.11.1",
    "mplsoccer>=1.8.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hs_pinn"]
